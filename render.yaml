services:
  # Python API backend
  - type: web
    name: vtab-reporting-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: VTAB_ENVIRONMENT
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VTAB_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: VTAB_REFRESH_WORKER_ENABLED
        value: 1
      - key: VTAB_REFRESH_POLL_SECONDS
        value: 30
      - key: VTAB_WEB_URL
        sync: false
      - key: VTAB_ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 8820

  # Frontend static site
  - type: web
    name: vtab-reporting-web
    env: static
    buildCommand: npm install && npm run build:web
    staticPublishPath: dist-web
    envVars:
      - key: VITE_APP_MODE
        value: WORKSPACE_ONLY
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: VITE_WEB_URL
        sync: false
