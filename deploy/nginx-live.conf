server {
    server_name reportservices.vtabsquare.com;

    client_max_body_size 100M;
    client_body_buffer_size 16M;
    client_body_timeout 120s;

    root /var/www/reportingtool-webservice/dist-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://127.0.0.1:8820/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/reportservices.vtabsquare.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reportservices.vtabsquare.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = reportservices.vtabsquare.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name reportservices.vtabsquare.com;
    return 404; # managed by Certbot
}
